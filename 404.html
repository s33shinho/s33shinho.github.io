<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Page not found - Backlog Wallet</title>
    <style>
        @font-face { font-family: 'Source Sans 3'; font-weight: 200 900; font-display: swap; src: url('/vendor/fonts/SourceSans3-var.woff') format('woff'); }
        @font-face { font-family: 'IBM Plex Mono'; font-weight: 500; font-display: swap; src: url('/vendor/fonts/IBMPlexMono-Medium.woff') format('woff'); }
        @font-face { font-family: 'Fraunces'; font-weight: 600; font-display: swap; src: url('/vendor/fonts/Fraunces-SemiBold.woff') format('woff'); }
        :root { --bg: #0c1411; --text: #a7b5ac; --white: #f3efe2; --dim: #84958b; --accent: #8fd3ae; --btn: #efe7d2; --ink: #0c1411; --border: #20302a; }
        @media (prefers-color-scheme: light) {
            :root { --bg: #f3eee2; --text: #47534c; --white: #121c17; --dim: #5f6b63; --accent: #1d6a4a; --btn: #17382b; --ink: #f6f1e4; --border: #ded7c6; }
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--text); font: 16px/1.6 'Source Sans 3', system-ui, sans-serif; }
        main { max-width: 440px; }
        .code { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-weight: 500; font-size: 14px; color: var(--dim); margin-bottom: 10px; }
        h1 { font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 38px; line-height: 1.1; color: var(--white); margin-bottom: 14px; letter-spacing: -0.02em; }
        p { margin-bottom: 22px; }
        a.btn { display: inline-block; padding: 11px 24px; border-radius: 999px; background: var(--btn); color: var(--ink); font-weight: 600; text-decoration: none; }
        a.btn:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <main>
        <div class="code">404</div>
        <h1>This page does not exist.</h1>
        <p>The link may be old or mistyped. Your library is fine and one click away.</p>
        <a class="btn" href="/">Back to Backlog Wallet</a>
    </main>
</body>
</html>
