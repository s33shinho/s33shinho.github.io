<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Page not found - Backlog Wallet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0a0c11; --text: #a8b2c4; --white: #f2f5fa; --dim: #78829a; --accent: #6aa8e8; --btn: #3a78c2; --border: #232a38; }
        @media (prefers-color-scheme: light) {
            :root { --bg: #f5f5f8; --text: #4b5162; --white: #0e1119; --dim: #6d7488; --accent: #2b64ad; --btn: #2b64ad; --border: #e2e3ea; }
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--text); font: 16px/1.6 'Source Sans 3', system-ui, sans-serif; }
        main { max-width: 440px; }
        .code { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-weight: 500; font-size: 14px; color: var(--dim); margin-bottom: 10px; }
        h1 { font-size: 30px; line-height: 1.2; color: var(--white); margin-bottom: 12px; letter-spacing: -0.01em; }
        p { margin-bottom: 22px; }
        a.btn { display: inline-block; padding: 10px 18px; border-radius: 5px; background: var(--btn); color: #fff; font-weight: 600; text-decoration: none; }
        a.btn:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <main>
        <div class="code">404</div>
        <h1>This page does not exist.</h1>
        <p>The link may be old or mistyped. Your library is fine and one click away.</p>
        <a class="btn" href="/">Back to Backlog Wallet</a>
    </main>
</body>
</html>
